plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.24.0'
}

group = 'dk.stephan'
version = '0.0.1-SNAPSHOT'
description = 'madkursus'

java {
	sourceCompatibility = '21'
	targetCompatibility = '21'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openApiValidate {
	inputSpec = "$projectDir/src/main/resources/openapi/madkursus-api.yaml"
}

openApiGenerate {
	generatorName = 'spring'
	inputSpec = "$projectDir/src/main/resources/openapi/madkursus-api.yaml"
	outputDir = "$buildDir/generated/openapi"
	configFile = "$projectDir/src/main/resources/openapi/interface-config.json"
	modelNameSuffix = 'DTO'
	globalProperties = [models: '', apis: '', supportingFiles: 'ApiUtil.java']
}

sourceSets.main.java.srcDir "$buildDir/generated/openapi/src/main/java"

tasks.named('compileJava') {
	dependsOn tasks.named('openApiGenerate')
}

tasks.named('check') {
	dependsOn tasks.named('openApiValidate')
}

tasks.named('test') {
	useJUnitPlatform()
}

// This service is deployed as Spring Boot's executable archive. Producing a
// second dependency-free *-plain.jar makes it easy to launch the wrong artifact.
tasks.named('jar') {
	enabled = false
}

tasks.register('verifyBootJarSecurity') {
	dependsOn tasks.named('bootJar')
	doLast {
		def archive = tasks.named('bootJar').get().archiveFile.get().asFile
		def securityCorePresent = zipTree(archive).matching {
			include 'BOOT-INF/lib/spring-security-core-*.jar'
		}.files
		if (securityCorePresent.empty) {
			throw new GradleException("Executable Boot JAR is missing spring-security-core")
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifyBootJarSecurity')
}
