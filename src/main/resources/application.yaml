spring:
  application:
    name: madkursus
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/madkursus}
    username: ${DB_USERNAME:madkursus}
    password: ${DB_PASSWORD:madkursus}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    registration-enabled: ${REGISTRATION_ENABLED:true}
  session:
    store-type: jdbc
    timeout: 30d
    jdbc:
      initialize-schema: never

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: strict
        max-age: 30d
