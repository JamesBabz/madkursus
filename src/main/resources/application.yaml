spring:
  application:
    name: madkursus
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/madkursus}
    username: ${DB_USERNAME:madkursus}
    password: ${DB_PASSWORD:madkursus}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    registration-enabled: ${REGISTRATION_ENABLED:true}
  session:
    store-type: jdbc
    timeout: 30d
    jdbc:
      initialize-schema: never

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: strict
        max-age: 30d

madkursus:
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3.1:8b}
      connect-timeout: ${OLLAMA_CONNECT_TIMEOUT:3s}
      read-timeout: ${OLLAMA_READ_TIMEOUT:120s}
  admin-username: ${ADMIN_USERNAME:}

# Never emit HTTP request payloads. In particular, login JSON necessarily contains a password.
logging:
  level:
    org.springframework.web.HttpLogging: OFF
    org.springframework.web.filter.CommonsRequestLoggingFilter: OFF
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO

    dk:
      jamesbabz:
        madkursus:
          service:
            applications:
              AiSuggestionValidator: DEBUG
          outbound:
            ollama:
              OllamaChatAdapter: DEBUG
