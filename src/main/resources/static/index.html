<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f7f8f5">
  <meta name="description" content="" data-i18n-content="app.description">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="stylesheet" href="/css/app.css?v=68">
  <title>Madkursus</title>
</head>
<body>
  <section class="auth-screen" id="auth-screen" hidden>
    <div class="auth-card">
      <p class="eyebrow" data-i18n="auth.welcome"></p>
      <h1>Madkursus</h1>
      <div class="auth-tabs" id="auth-tabs" role="tablist" aria-label="" data-i18n-aria-label="auth.accessType">
        <button class="active" id="auth-tab-login" type="button" role="tab" aria-selected="true" aria-controls="login-form" data-i18n="auth.login"></button>
        <button id="auth-tab-register" type="button" role="tab" aria-selected="false" aria-controls="register-form" hidden data-i18n="auth.register"></button>
      </div>
      <form id="login-form" role="tabpanel" aria-labelledby="auth-tab-login">
        <h2 data-i18n="auth.login"></h2>
        <label for="login-username" data-i18n="auth.username"></label>
        <input id="login-username" name="username" type="text" autocomplete="username" maxlength="100" required>
        <label for="login-password" data-i18n="auth.password"></label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button class="primary-button" type="submit" data-i18n="auth.login"></button>
      </form>
      <form id="register-form" role="tabpanel" aria-labelledby="auth-tab-register" hidden>
        <h2 data-i18n="auth.register"></h2>
        <label for="register-username" data-i18n="auth.username"></label>
        <input id="register-username" name="username" type="text" autocomplete="username" maxlength="100" required>
        <label for="register-password" data-i18n="auth.password"></label>
        <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="10" required>
        <label for="register-confirm" data-i18n="auth.confirmPassword"></label>
        <input id="register-confirm" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="10" required>
        <button class="primary-button" type="submit" data-i18n="auth.createAccount"></button>
      </form>
      <div class="notice error" id="auth-error" role="alert" hidden></div>
      <div class="notice success" id="auth-success" role="status" hidden></div>
    </div>
  </section>

  <div id="application" class="app-shell" hidden>
  <button id="chat-launcher" class="chat-launcher" type="button" aria-label="" data-i18n-aria-label="chat.open" title="" data-i18n-title="chat.open" aria-haspopup="dialog" aria-controls="chat-drawer" aria-expanded="false"><span class="nav-icon" data-icon="chat" aria-hidden="true"></span></button>
  <section id="chat-drawer" class="chat-drawer" role="dialog" aria-modal="false" aria-labelledby="chat-drawer-title" hidden>
    <div class="section-heading"><div><p class="eyebrow" data-i18n="chat.subtitle"></p><h2 id="chat-drawer-title" data-i18n="chat.assistantName"></h2></div><button id="chat-minimize" class="icon-button" type="button" aria-label="" data-i18n-aria-label="chat.minimize" title="" data-i18n-title="chat.minimize" autofocus><span class="nav-icon" data-icon="minimize" aria-hidden="true"></span></button></div>
    <div id="chat-drawer-host"></div>
  </section>
  <aside class="app-sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">M</span><span>Madkursus</span></div>
    <nav class="primary-nav" aria-label="" data-i18n-aria-label="navigation.primary">
      <button class="nav-button" id="show-meal-plans-primary" type="button"><span class="nav-icon" data-icon="calendar"></span><span data-i18n="mealPlan.title"></span></button>
      <button class="nav-button active" id="show-inventory" type="button"><span class="nav-icon" data-icon="inventory"></span><span data-i18n="inventory.title"></span></button>
      <button class="nav-button" id="show-shopping" type="button"><span class="nav-icon" data-icon="cart"></span><span data-i18n="shoppingList.title"></span></button>
      <button class="nav-button" id="show-recipes" type="button"><span class="nav-icon" data-icon="recipe"></span><span data-i18n="recipes.title"></span></button>
      <span class="nav-divider" aria-hidden="true"></span>
      <button class="nav-button secondary-nav" id="show-ai" type="button"><span class="nav-icon" data-icon="chat"></span><span data-i18n="chat.assistantName"></span></button>
      <button class="nav-button secondary-nav" id="show-products" type="button"><span class="nav-icon" data-icon="products"></span><span data-i18n="products.title"></span></button>
      <button class="nav-button secondary-nav" id="show-kitchen" type="button"><span class="nav-icon" data-icon="kitchen"></span><span data-i18n="equipment.title"></span></button>
      <button class="nav-button secondary-nav" id="show-nutrition" type="button" hidden><span class="nav-icon" data-icon="products"></span><span data-i18n="nutrition.title"></span></button>
      <button class="nav-button" id="show-more" type="button"><span class="nav-icon" data-icon="more"></span><span data-i18n="navigation.more"></span></button>
    </nav>
    <button class="logout-button sidebar-logout" id="logout" type="button"><span class="nav-icon" data-icon="logout"></span><span data-i18n="auth.logout"></span></button>
  </aside>
  <main class="app-content">
    <section id="ai-view" class="chat-page" aria-labelledby="chat-title" hidden>
      <div class="page-heading"><p class="eyebrow" data-i18n="chat.previewTitle"></p><h2 id="chat-title" data-i18n="chat.subtitle"></h2><p class="page-subtitle" data-i18n="chat.description"></p></div>
      <div class="chat-panel" id="chat-component">
        <p id="chat-model" class="chat-model" role="status" data-i18n="chat.model.loading"></p>
        <div id="chat-empty" class="chat-empty">
          <h3 data-i18n="chat.welcomeTitle"></h3>
          <p data-i18n="chat.welcomeHint"></p>
          <div class="chat-examples" aria-label="" data-i18n-aria-label="chat.suggestedQuestions">
            <button class="secondary-button" type="button" data-chat-prompt data-i18n="chat.prompts.discover"></button>
            <button class="secondary-button" type="button" data-chat-prompt data-max-extra="0" data-i18n="chat.prompts.inventoryOnly"></button>
            <button class="secondary-button" type="button" data-chat-prompt="" data-i18n-data-chat-prompt="chat.prompts.oneExtra" data-max-extra="1" data-i18n="chat.quickActions.oneExtra"></button>
          </div>
        </div>
        <div id="chat-messages" class="chat-messages" role="log" aria-label="" data-i18n-aria-label="chat.historyLabel" aria-live="polite" aria-relevant="additions" tabindex="0" hidden></div>
        <p id="chat-loading" class="chat-loading" role="status" hidden data-i18n="chat.thinking"></p>
        <div id="chat-error" class="notice error" role="alert" hidden></div>
        <form id="chat-form" class="chat-composer">
          <select id="chat-max-extra" class="chat-limit" aria-label="" data-i18n-aria-label="chat.extraIngredients"><option value="" data-i18n="chat.limits.unlimited"></option><option value="0" data-i18n="chat.limits.inventoryOnly"></option><option value="1" data-i18n="chat.limits.oneExtra"></option><option value="2" data-i18n="chat.limits.twoExtra"></option><option value="3" data-i18n="chat.limits.threeExtra"></option></select>
          <div class="chat-input-row"><textarea id="chat-input" rows="2" maxlength="4000" required aria-label="" data-i18n-aria-label="chat.inputLabel" placeholder="" data-i18n-placeholder="chat.inputPlaceholder" aria-describedby="chat-help"></textarea><button id="chat-send" class="primary-button" type="submit" disabled data-i18n="chat.send"></button></div>
          <p id="chat-help" class="field-help" data-i18n="chat.followUpHint"></p>
        </form>
      </div>
    </section>
    <div id="products-view" class="collection-view">
    <section class="form-panel" id="product-form-panel" aria-labelledby="form-title" hidden>
      <div class="section-heading">
        <h2 id="form-title" data-i18n="products.add"></h2>
        <button class="icon-button" id="close-form" type="button" aria-label="" data-i18n-aria-label="common.closeForm">×</button>
      </div>
      <label for="template-search" data-i18n="products.search"></label>
      <input id="template-search" type="search" placeholder="" data-i18n-placeholder="products.searchPlaceholder" autocomplete="off">
      <div class="template-results" id="template-results" aria-live="polite"></div>
      <button class="secondary-button custom-toggle" id="show-custom-product" type="button" data-i18n="products.createCustom"></button>
      <form id="product-form" hidden>
        <label for="name" data-i18n="common.name"></label>
        <input id="name" name="name" type="text" autocomplete="off" maxlength="100" required>

        <label for="category" data-i18n="products.category"></label>
        <select id="category" name="category" required>
          <option value="BAKING" data-i18n="products.categories.baking"></option><option value="BREAD" data-i18n="products.categories.bread"></option>
          <option value="EGG" data-i18n="products.categories.eggs"></option><option value="FISH" data-i18n="products.categories.fish"></option><option value="FROZEN" data-i18n="products.categories.frozen"></option>
          <option value="GRAIN_PASTA" data-i18n="products.categories.grainsPasta"></option><option value="HERB" data-i18n="products.categories.herbs"></option>
          <option value="LEGUME" data-i18n="products.categories.legumes"></option><option value="MEAT" data-i18n="products.categories.meat"></option>
          <option value="NUT_SEED" data-i18n="products.categories.nutsSeeds"></option><option value="OIL_FAT" data-i18n="products.categories.oilsFats"></option>
          <option value="PRESERVED" data-i18n="products.categories.preserved"></option><option value="SAUCE_CONDIMENT" data-i18n="products.categories.saucesCondiments"></option>
          <option value="STOCK" data-i18n="products.categories.stock"></option><option value="SWEETENER" data-i18n="products.categories.sweeteners"></option>
          <option value="VINEGAR_ACID" data-i18n="products.categories.vinegarAcid"></option>
          <option value="VEGETABLE" data-i18n="products.categoryOptions.vegetable"></option>
          <option value="FRUIT" data-i18n="products.categories.fruit"></option>
          <option value="DAIRY" data-i18n="products.categories.dairy"></option>
          <option value="DRY_GOODS" data-i18n="products.categories.dryGoods"></option>
          <option value="SPICE" data-i18n="products.categoryOptions.spice"></option>
          <option value="OTHER" data-i18n="common.other"></option>
        </select>

        <label for="default-unit" data-i18n="products.defaultUnit"></label>
        <select id="default-unit" name="defaultUnit" required>
          <option value="GRAM" data-i18n="units.gram"></option>
          <option value="MILLILITER" data-i18n="units.milliliter"></option>
          <option value="PIECE" data-i18n="units.piece"></option>
        </select>

        <button class="primary-button" id="save-product" type="submit" data-i18n="products.save"></button>
      </form>
    </section>

    <div class="notice error" id="error-message" role="alert" hidden></div>
    <section aria-labelledby="products-title">
      <div class="section-heading product-heading">
        <div>
          <p class="eyebrow" data-i18n="products.title"></p>
          <h2 id="products-title" data-i18n="products.collectionTitle"></h2>
        </div>
        <button class="add-button section-add-button" id="open-form" type="button" aria-controls="product-form-panel" aria-expanded="false"><span aria-hidden="true">+</span> <span data-i18n="products.add"></span></button>
      </div>
      <div class="collection-toolbar"><div class="collection-search"><label class="visually-hidden" for="products-collection-search" data-i18n="collection.search"></label><input id="products-collection-search" type="search" autocomplete="off" data-i18n-placeholder="collection.searchPlaceholder" aria-controls="product-list"></div></div>
      <p id="products-no-results" class="collection-no-results" role="status" hidden data-i18n="collection.noResults"></p>
      <p class="loading" id="loading-message" role="status" data-i18n="products.loading"></p>
      <div class="product-list" id="product-list" aria-live="polite"></div>
      <div class="empty-state" id="empty-state" hidden>
        <span class="empty-icon" data-icon="products"></span><h3 data-i18n="products.emptyTitle"></h3><p data-i18n="products.emptyHint"></p>
        <button class="primary-button" id="empty-add" type="button" data-i18n="products.addShortcut"></button>
      </div>
    </section>
    </div>

    <section class="collection-view" id="inventory-view" aria-labelledby="inventory-title" hidden>
      <div class="section-heading product-heading">
        <div><p class="eyebrow" data-i18n="inventory.title"></p><h2 id="inventory-title" data-i18n="inventory.title"></h2></div>
        <button class="add-button section-add-button" id="open-inventory-add" type="button"><span aria-hidden="true">+</span> <span data-i18n="common.addItem"></span></button>
      </div>
      <div class="collection-toolbar"><div class="collection-search"><label class="visually-hidden" for="inventory-collection-search" data-i18n="collection.search"></label><input id="inventory-collection-search" type="search" autocomplete="off" data-i18n-placeholder="collection.searchPlaceholder" aria-controls="inventory-list"></div><button class="text-button collection-tool" id="copy-inventory" type="button" disabled data-i18n="inventory.copy"></button></div>
      <p id="inventory-no-results" class="collection-no-results" role="status" hidden data-i18n="collection.noResults"></p>
      <p class="loading" id="inventory-loading" role="status" data-i18n="inventory.loading"></p>
      <div class="product-list" id="inventory-list" aria-live="polite"></div>
      <div class="empty-state" id="inventory-empty" hidden>
        <span class="empty-icon" data-icon="inventory"></span><h3 data-i18n="inventory.emptyTitle"></h3><p data-i18n="inventory.emptyHint"></p>
        <button class="primary-button" id="inventory-empty-add" type="button" data-i18n="inventory.addFirst"></button>
      </div>
    </section>

    <section class="collection-view" id="shopping-view" aria-labelledby="shopping-title" hidden>
      <div class="section-heading product-heading">
        <div><p class="eyebrow" data-i18n="shoppingList.title"></p><h2 id="shopping-title" data-i18n="shoppingList.title"></h2></div>
        <button class="add-button section-add-button" id="open-shopping-add" type="button"><span aria-hidden="true">+</span> <span data-i18n="common.addItem"></span></button>
      </div>
      <p class="loading" id="shopping-loading" role="status" data-i18n="shoppingList.loading"></p>
      <div class="collection-toolbar shopping-tools"><button class="text-button collection-tool" id="open-shopping-text" type="button" data-i18n="shoppingList.pasteList"></button></div>
      <div class="shopping-section" id="shopping-active-section">
        <div class="shopping-list" id="shopping-active-list" aria-live="polite"></div>
      </div>
      <details class="shopping-section purchased-section" id="shopping-purchased-section" hidden>
        <summary><span data-i18n="common.purchased"></span><span id="shopping-purchased-count" class="status-badge"></span></summary>
        <div class="section-heading"><button class="text-button" id="clear-purchased" type="button" data-i18n="shoppingList.clearPurchased"></button></div>
        <div class="shopping-list" id="shopping-purchased-list" aria-live="polite"></div>
      </details>
      <div class="empty-state" id="shopping-empty" hidden><span class="empty-icon" data-icon="cart"></span><h3 data-i18n="shoppingList.emptyTitle"></h3><p data-i18n="shoppingList.emptyHint"></p><button class="primary-button" id="shopping-empty-add" type="button" data-i18n="inventory.addFirst"></button></div>
    </section>

    <section id="recipes-view" aria-labelledby="recipes-title" hidden>
      <div class="section-heading product-heading">
        <div><p class="eyebrow" data-i18n="recipes.title"></p><h2 id="recipes-title" data-i18n="recipes.yourRecipes"></h2></div>
        <div class="header-actions"><button class="secondary-button compact-button" id="plan-recipes" type="button" data-i18n="mealPlan.plan"></button><button class="add-button section-add-button" id="new-recipe" type="button"><span aria-hidden="true">+</span> <span data-i18n="recipes.newRecipe"></span></button></div>
      </div>
      <div class="recipe-subnav"><button class="active" id="show-recipe-library" type="button" aria-pressed="true" data-i18n="recipes.myRecipes"></button><button id="show-recipe-templates" type="button" aria-pressed="false" data-i18n="recipes.discover"></button><button id="show-meal-plans" type="button" hidden data-i18n="mealPlan.pluralTitle"></button></div>
      <div id="recipe-library-panel">
        <div class="collection-search"><label for="recipe-library-search" data-i18n="recipes.librarySearch"></label><input id="recipe-library-search" type="search" autocomplete="off" placeholder="" data-i18n-placeholder="recipes.searchPlaceholder"></div>
        <p class="loading" id="recipes-loading" role="status" data-i18n="recipes.loading"></p>
        <div class="recipe-list" id="recipe-list" aria-live="polite"></div>
        <div class="empty-state" id="recipes-search-empty" role="status" hidden><p data-i18n="recipes.noSearchResults"></p></div>
      <div class="empty-state" id="recipes-empty" hidden><span class="empty-icon" data-icon="recipe"></span><h3 data-i18n="recipes.emptyTitle"></h3><p data-i18n="recipes.emptyHint"></p><button class="primary-button" id="recipes-empty-add" type="button" data-i18n="recipes.createFirst"></button></div>
      </div>
      <div id="recipe-templates-panel" hidden>
        <div class="collection-search"><label for="recipe-template-catalog-search" data-i18n="recipes.catalogSearch"></label>
        <input id="recipe-template-catalog-search" type="search" autocomplete="off" placeholder="" data-i18n-placeholder="recipes.searchPlaceholder"></div>
        <p class="loading" id="recipe-templates-loading" hidden data-i18n="recipes.loading"></p>
        <div class="recipe-list" id="recipe-template-list" aria-live="polite"></div>
        <div class="empty-state" id="recipe-templates-empty" role="status" hidden><p data-i18n="recipes.noSearchResults"></p></div>
      </div>
      <div id="meal-plans-panel" hidden><p class="loading" id="meal-plans-loading" hidden data-i18n="mealPlan.loading"></p><div class="recipe-list" id="meal-plan-list"></div><div class="empty-state" id="meal-plans-empty" hidden><p data-i18n="mealPlan.emptyHint"></p><button class="secondary-button" id="meal-plans-empty-create" type="button" data-i18n="mealPlan.create"></button></div></div>
    </section>
    <section id="kitchen-view" aria-labelledby="kitchen-title" hidden>
      <div class="section-heading product-heading">
        <div><p class="eyebrow" data-i18n="common.settings"></p><h2 id="kitchen-title" data-i18n="equipment.title"></h2></div>
        <button class="add-button section-add-button" id="add-kitchen-equipment" type="button"><span aria-hidden="true">+</span> <span data-i18n="equipment.add"></span></button>
      </div>
      <p class="loading" id="kitchen-loading" hidden data-i18n="equipment.loading"></p>
      <div class="equipment-management-list" id="kitchen-equipment-list" aria-live="polite"></div>
      <div class="empty-state" id="kitchen-empty" hidden><span class="empty-icon" data-icon="kitchen"></span><h3 data-i18n="equipment.emptyTitle"></h3><p data-i18n="equipment.emptyHint"></p><button class="primary-button" id="kitchen-empty-add" type="button" data-i18n="equipment.addFirst"></button></div>
      <button class="secondary-button full-button kitchen-back" id="close-kitchen" type="button" data-i18n="common.back"></button>
    </section>
    <section id="more-view" aria-labelledby="more-title" hidden>
      <div class="page-heading"><p class="eyebrow" data-i18n="common.settings"></p><h2 id="more-title" data-i18n="navigation.more"></h2><p class="page-subtitle" data-i18n="navigation.moreDescription"></p></div>
        <div class="settings-list">
        <button id="more-send-feedback" type="button"><span class="nav-icon" data-icon="chat"></span><span><strong data-i18n="feedback.sendTitle"></strong><small data-i18n="feedback.sendHint"></small></span><span aria-hidden="true">›</span></button>
        <button id="more-feedback-admin" type="button" hidden><span class="nav-icon" data-icon="chat"></span><span><strong data-i18n="feedback.adminTitle"></strong><small data-i18n="feedback.adminHint"></small></span><span aria-hidden="true">›</span></button>
          <button id="more-ai" type="button"><span class="nav-icon" data-icon="chat"></span><span><strong data-i18n="chat.assistantName"></strong><small data-i18n="navigation.chatDescription"></small></span><span aria-hidden="true">›</span></button>
        <button id="more-products" type="button"><span class="nav-icon" data-icon="products"></span><span><strong data-i18n="products.title"></strong><small data-i18n="navigation.productsDescription"></small></span><span aria-hidden="true">›</span></button>
        <button id="more-kitchen" type="button"><span class="nav-icon" data-icon="kitchen"></span><span><strong data-i18n="equipment.title"></strong><small data-i18n="navigation.equipmentDescription"></small></span><span aria-hidden="true">›</span></button>
        <button id="more-recipe-import" type="button" hidden><span class="nav-icon" data-icon="recipe"></span><span><strong data-i18n="recipes.import.title"></strong><small data-i18n="recipes.import.subtitle"></small></span><span aria-hidden="true">›</span></button>
        <button id="more-nutrition" type="button" hidden><span class="nav-icon" data-icon="products"></span><span><strong data-i18n="nutrition.title"></strong><small data-i18n="navigation.nutritionDescription"></small></span><span aria-hidden="true">›</span></button>
        <button id="more-logout" class="danger-row" type="button"><span class="nav-icon" data-icon="logout"></span><span><strong data-i18n="auth.logout"></strong><small data-i18n="auth.logoutDescription"></small></span><span aria-hidden="true">›</span></button>
      </div>
    </section>
    <section id="recipe-import-view" aria-labelledby="recipe-import-title" hidden>
      <div class="section-heading"><div><p class="eyebrow" data-i18n="recipes.import.developerTool"></p><h2 id="recipe-import-title" data-i18n="recipes.import.title"></h2></div><button id="close-recipe-import" type="button" class="text-button" data-i18n="navigation.backToMore"></button></div>
      <p data-i18n="recipes.import.instructions"></p>
      <label for="recipe-import-json" data-i18n="recipes.import.jsonLabel"></label>
      <textarea id="recipe-import-json" rows="18" maxlength="500000" spellcheck="false" placeholder="" data-i18n-placeholder="recipes.import.jsonPlaceholder"></textarea>
      <div class="recipe-import-actions"><button id="recipe-import-validate" type="button" class="primary-button" data-i18n="common.validate"></button><button id="recipe-import-format" type="button" class="secondary-button" data-i18n="recipes.import.formatJson"></button><button id="recipe-import-clear" type="button" class="text-button" data-i18n="common.clear"></button></div>
      <div id="recipe-import-result" role="status" aria-live="polite"></div>
      <button id="recipe-import-submit" type="button" class="primary-button" hidden data-i18n="common.import"></button>
    </section>
