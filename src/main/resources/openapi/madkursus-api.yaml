openapi: 3.0.3
info:
  title: Madkursus API
  version: v1
  description: API for managing products and inventory.
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://madkursus.jamesbabz.duckdns.org
    description: Production
tags:
  - name: product
  - name: inventory
  - name: auth
  - name: product-template
  - name: kitchen-equipment
paths:
  /v1/product-templates:
    get:
      tags: [product-template]
      operationId: getProductTemplates
      parameters:
        - {name: search, in: query, required: false, schema: {type: string}}
        - {name: common, in: query, required: false, schema: {type: boolean}}
      responses:
        '200':
          description: Matching templates
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ProductTemplate'}}
  /v1/product-templates/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [product-template]
      operationId: getProductTemplate
      responses:
        '200':
          description: Product template
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductTemplate'}
        '404': {$ref: '#/components/responses/notFound'}
  /v1/products/from-template/{templateId}:
    parameters:
      - name: templateId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [product]
      operationId: createProductFromTemplate
      responses:
        '201':
          description: Product created from template
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '404': {$ref: '#/components/responses/notFound'}
        '409': {$ref: '#/components/responses/conflict'}
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUser'}
        '400': {$ref: '#/components/responses/badRequest'}
        '401': {$ref: '#/components/responses/unauthorized'}
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        '204': {description: Logged out}
        '401': {$ref: '#/components/responses/unauthorized'}
  /v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUser'}
        '401': {$ref: '#/components/responses/unauthorized'}
  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: Registered user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUser'}
        '400': {$ref: '#/components/responses/badRequest'}
        '403': {$ref: '#/components/responses/forbidden'}
        '409': {$ref: '#/components/responses/conflict'}
  /v1/auth/registration-status:
    get:
      tags: [auth]
      operationId: getRegistrationStatus
      responses:
        '200':
          description: Registration configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistrationStatus'}
  /v1/auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrfToken
      responses:
        '200':
          description: CSRF token for same-origin mutation requests
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CsrfToken'}
  /v1/products:
    get:
      tags: [product]
      operationId: getProducts
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Product'}
        '500': {$ref: '#/components/responses/serverException'}
    post:
      tags: [product]
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProduct'}
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '400': {$ref: '#/components/responses/badRequest'}
        '500': {$ref: '#/components/responses/serverException'}
  /v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [product]
      operationId: getProduct
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '404': {$ref: '#/components/responses/notFound'}
        '500': {$ref: '#/components/responses/serverException'}
    patch:
      tags: [product]
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProduct'}
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '400': {$ref: '#/components/responses/badRequest'}
        '404': {$ref: '#/components/responses/notFound'}
        '500': {$ref: '#/components/responses/serverException'}
    delete:
      tags: [product]
      operationId: deleteProduct
      responses:
        '204': {description: Product deleted}
        '404': {$ref: '#/components/responses/notFound'}
        '409': {$ref: '#/components/responses/conflict'}
        '500': {$ref: '#/components/responses/serverException'}
  /v1/inventory:
    get:
      tags: [inventory]
      operationId: getInventory
      responses:
        '200':
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/InventoryItem'}
        '500': {$ref: '#/components/responses/serverException'}
    post:
      tags: [inventory]
      operationId: createInventoryItem
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddInventoryItem'}
      responses:
        '201':
          description: Inventory item created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryItem'}
        '400': {$ref: '#/components/responses/badRequest'}
        '404': {$ref: '#/components/responses/notFound'}
        '500': {$ref: '#/components/responses/serverException'}
  /v1/inventory/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [inventory]
      operationId: getInventoryItem
      responses:
        '200':
          description: Inventory item
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryItem'}
        '404': {$ref: '#/components/responses/notFound'}
        '500': {$ref: '#/components/responses/serverException'}
    patch:
      tags: [inventory]
      operationId: updateInventoryItem
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateInventoryItem'}
      responses:
        '204': {description: 'Inventory amount updated, or row removed when quantity is zero'}
        '400': {$ref: '#/components/responses/badRequest'}
        '404': {$ref: '#/components/responses/notFound'}
        '500': {$ref: '#/components/responses/serverException'}
    delete:
      tags: [inventory]
      operationId: deleteInventoryItem
      responses:
        '204': {description: Inventory item deleted}
        '404': {$ref: '#/components/responses/notFound'}
        '500': {$ref: '#/components/responses/serverException'}
  /v1/inventory/from-template/{templateId}:
    parameters:
      - name: templateId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [inventory]
      operationId: createInventoryItemFromTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddInventoryQuantity'}
      responses:
        '201':
          description: Inventory stock added from template
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryItem'}
        '400': {$ref: '#/components/responses/badRequest'}
        '404': {$ref: '#/components/responses/notFound'}
  /v1/shopping-list:
    get:
      tags: [shopping-list]
      operationId: getShoppingList
      responses:
        '200':
          description: Current user's shopping list
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ShoppingListItem'}}
        '500': {$ref: '#/components/responses/serverException'}
  /v1/shopping-list/items:
    post:
      tags: [shopping-list]
      operationId: addShoppingListItem
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddShoppingListItem'}
      responses:
        '201':
          description: Item added
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShoppingListItem'}
        '400': {$ref: '#/components/responses/badRequest'}
        '404': {$ref: '#/components/responses/notFound'}
  /v1/shopping-list/items/from-template/{templateId}:
    parameters:
      - name: templateId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [shopping-list]
      operationId: addShoppingListItemFromTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShoppingListQuantity'}
      responses:
        '201':
          description: Item added from template
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShoppingListItem'}
        '400': {$ref: '#/components/responses/badRequest'}
        '404': {$ref: '#/components/responses/notFound'}
  /v1/shopping-list/items/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    patch:
      tags: [shopping-list]
      operationId: updateShoppingListItem
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShoppingListQuantity'}
      responses:
        '200':
          description: Item updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShoppingListItem'}
        '400': {$ref: '#/components/responses/badRequest'}
        '404': {$ref: '#/components/responses/notFound'}
        '409': {$ref: '#/components/responses/conflict'}
    delete:
      tags: [shopping-list]
      operationId: deleteShoppingListItem
      responses:
        '204': {description: Item deleted}
        '404': {$ref: '#/components/responses/notFound'}
        '409': {$ref: '#/components/responses/conflict'}
  /v1/shopping-list/items/{id}/purchase:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      tags: [shopping-list]
      operationId: purchaseShoppingListItem
      responses:
        '200':
          description: Item purchased and Inventory updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShoppingListItem'}
        '404': {$ref: '#/components/responses/notFound'}
  /v1/shopping-list/items/{id}/undo-purchase:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      tags: [shopping-list]
      operationId: undoShoppingListItemPurchase
      responses:
        '200':
          description: Purchase undone and Inventory reversed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShoppingListItem'}
        '404': {$ref: '#/components/responses/notFound'}
        '409': {$ref: '#/components/responses/conflict'}
  /v1/shopping-list/purchased:
    delete:
      tags: [shopping-list]
      operationId: clearPurchasedShoppingListItems
      responses:
        '204': {description: Purchased items cleared without changing Inventory}
  /v1/recipes:
    get:
      tags: [recipe]
      operationId: getRecipes
      responses:
        '200': {description: Recipes, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Recipe'}}}}}
    post:
      tags: [recipe]
      operationId: createRecipe
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecipeInput'}}}}
      responses:
        '201': {description: Recipe created, content: {application/json: {schema: {$ref: '#/components/schemas/Recipe'}}}}
        '400': {$ref: '#/components/responses/badRequest'}
  /v1/recipes/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [recipe]
      operationId: getRecipe
      responses:
        '200': {description: Recipe, content: {application/json: {schema: {$ref: '#/components/schemas/Recipe'}}}}
        '404': {$ref: '#/components/responses/notFound'}
    patch:
      tags: [recipe]
      operationId: updateRecipe
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecipeInput'}}}}
      responses:
        '200': {description: Recipe updated, content: {application/json: {schema: {$ref: '#/components/schemas/Recipe'}}}}
        '400': {$ref: '#/components/responses/badRequest'}
        '404': {$ref: '#/components/responses/notFound'}
    delete:
      tags: [recipe]
      operationId: deleteRecipe
      responses:
        '204': {description: Recipe deleted}
        '404': {$ref: '#/components/responses/notFound'}
  /v1/recipes/calculate-requirements:
    post:
      tags: [recipe]
      operationId: calculateRecipeRequirements
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecipeSelections'}}}}
      responses:
        '200': {description: Aggregated requirements, content: {application/json: {schema: {$ref: '#/components/schemas/RecipeRequirementCalculation'}}}}
        '400': {$ref: '#/components/responses/badRequest'}
        '404': {$ref: '#/components/responses/notFound'}
  /v1/recipes/add-missing-to-shopping-list:
    post:
      tags: [recipe]
      operationId: addMissingRecipeRequirementsToShoppingList
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecipeSelections'}}}}
      responses:
        '200': {description: Missing requirements added, content: {application/json: {schema: {$ref: '#/components/schemas/RecipeRequirementCalculation'}}}}
        '400': {$ref: '#/components/responses/badRequest'}
        '404': {$ref: '#/components/responses/notFound'}
  /v1/recipes/{id}/cook:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      tags: [recipe]
      operationId: cookRecipe
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CookRecipeRequest'}}}}
      responses:
        '200': {description: Recipe cooked and Inventory adjusted, content: {application/json: {schema: {$ref: '#/components/schemas/CookRecipeResult'}}}}
        '400': {$ref: '#/components/responses/badRequest'}
        '404': {$ref: '#/components/responses/notFound'}
  /v1/meal-plans:
    get:
      tags: [meal-plan]
      operationId: getMealPlans
      responses:
        '200': {description: Meal plans, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MealPlan'}}}}}
    post:
      tags: [meal-plan]
      operationId: createMealPlan
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateMealPlan'}}}}
      responses:
        '201': {description: Meal plan created, content: {application/json: {schema: {$ref: '#/components/schemas/MealPlan'}}}}
        '400': {$ref: '#/components/responses/badRequest'}
  /v1/recipe-templates:
    get:
      tags: [recipe-template]
      operationId: getRecipeTemplates
      parameters:
        - {name: query, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Shared recipe templates, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RecipeTemplateSummary'}}}}}
  /v1/recipe-templates/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [recipe-template]
      operationId: getRecipeTemplate
      responses:
        '200': {description: Recipe template detail, content: {application/json: {schema: {$ref: '#/components/schemas/RecipeTemplate'}}}}
        '404': {$ref: '#/components/responses/notFound'}
  /v1/recipe-templates/{id}/add-to-my-recipes:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      tags: [recipe-template]
      operationId: addRecipeTemplateToMyRecipes
      responses:
        '201': {description: User Recipe created, content: {application/json: {schema: {$ref: '#/components/schemas/Recipe'}}}}
        '404': {$ref: '#/components/responses/notFound'}
        '409': {$ref: '#/components/responses/conflict'}
  /v1/meal-plans/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [meal-plan]
      operationId: getMealPlan
      responses:
        '200': {description: Meal plan, content: {application/json: {schema: {$ref: '#/components/schemas/MealPlan'}}}}
        '404': {$ref: '#/components/responses/notFound'}
    patch:
      tags: [meal-plan]
      operationId: updateMealPlan
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateMealPlan'}}}}
      responses:
        '200': {description: Meal plan updated, content: {application/json: {schema: {$ref: '#/components/schemas/MealPlan'}}}}
        '400': {$ref: '#/components/responses/badRequest'}
        '404': {$ref: '#/components/responses/notFound'}
    delete:
      tags: [meal-plan]
      operationId: deleteMealPlan
      responses:
        '204': {description: Meal plan deleted}
        '404': {$ref: '#/components/responses/notFound'}
  /v1/meal-plans/{id}/recipes:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      tags: [meal-plan]
      operationId: addPlannedRecipe
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreatePlannedRecipe'}}}}
      responses:
        '200': {description: Recipe added, content: {application/json: {schema: {$ref: '#/components/schemas/MealPlan'}}}}
        '404': {$ref: '#/components/responses/notFound'}
  /v1/meal-plans/{id}/recipes/{plannedRecipeId}:
    parameters:
      - {$ref: '#/components/parameters/id'}
      - {name: plannedRecipeId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [meal-plan]
      operationId: updatePlannedRecipe
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdatePlannedRecipe'}}}}
      responses:
        '200': {description: Planned recipe updated, content: {application/json: {schema: {$ref: '#/components/schemas/MealPlan'}}}}
        '409': {$ref: '#/components/responses/conflict'}
    delete:
      tags: [meal-plan]
      operationId: deletePlannedRecipe
      responses:
        '200': {description: Planned recipe deleted, content: {application/json: {schema: {$ref: '#/components/schemas/MealPlan'}}}}
        '404': {$ref: '#/components/responses/notFound'}
  /v1/meal-plans/{id}/recipes/{plannedRecipeId}/cook:
    parameters:
      - {$ref: '#/components/parameters/id'}
      - {name: plannedRecipeId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [meal-plan]
      operationId: cookPlannedRecipe
      responses:
        '200': {description: Planned recipe cooked, content: {application/json: {schema: {$ref: '#/components/schemas/CookRecipeResult'}}}}
        '409': {$ref: '#/components/responses/conflict'}
  /v1/meal-plans/{id}/recipes/{plannedRecipeId}/skip:
    parameters:
      - {$ref: '#/components/parameters/id'}
      - {name: plannedRecipeId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [meal-plan]
      operationId: toggleSkipPlannedRecipe
      responses:
        '200': {description: Skip toggled, content: {application/json: {schema: {$ref: '#/components/schemas/MealPlan'}}}}
        '409': {$ref: '#/components/responses/conflict'}
  /v1/meal-plans/{id}/requirements:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [meal-plan]
      operationId: getMealPlanRequirements
      responses:
        '200': {description: Outstanding requirements, content: {application/json: {schema: {$ref: '#/components/schemas/RecipeRequirementCalculation'}}}}
  /v1/meal-plans/{id}/add-missing-to-shopping-list:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      tags: [meal-plan]
      operationId: addMealPlanMissingToShoppingList
      responses:
        '200': {description: Missing items ensured on Shopping List, content: {application/json: {schema: {$ref: '#/components/schemas/RecipeRequirementCalculation'}}}}
  /v1/kitchen-equipment:
    get:
      tags: [kitchen-equipment]
      operationId: getKitchenEquipmentList
      responses:
        '200': {description: Current user's kitchen equipment, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/KitchenEquipment'}}}}}
        '401': {$ref: '#/components/responses/unauthorized'}
    post:
      tags: [kitchen-equipment]
      operationId: createKitchenEquipment
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/KitchenEquipmentInput'}}}}
      responses:
        '201': {description: Equipment created, content: {application/json: {schema: {$ref: '#/components/schemas/KitchenEquipment'}}}}
        '400': {$ref: '#/components/responses/badRequest'}
        '409': {$ref: '#/components/responses/conflict'}
  /v1/kitchen-equipment/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [kitchen-equipment]
      operationId: getKitchenEquipment
      responses:
        '200': {description: Equipment, content: {application/json: {schema: {$ref: '#/components/schemas/KitchenEquipment'}}}}
        '404': {$ref: '#/components/responses/notFound'}
    patch:
      tags: [kitchen-equipment]
      operationId: updateKitchenEquipment
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/KitchenEquipmentInput'}}}}
      responses:
        '200': {description: Equipment updated, content: {application/json: {schema: {$ref: '#/components/schemas/KitchenEquipment'}}}}
        '400': {$ref: '#/components/responses/badRequest'}
        '404': {$ref: '#/components/responses/notFound'}
        '409': {$ref: '#/components/responses/conflict'}
    delete:
      tags: [kitchen-equipment]
      operationId: deleteKitchenEquipment
      responses:
        '204': {description: Equipment deleted}
        '404': {$ref: '#/components/responses/notFound'}
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    badRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorMessage'}
    notFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorMessage'}
    conflict:
      description: Request conflicts with current state
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorMessage'}
    unauthorized:
      description: Authentication required or credentials invalid
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorMessage'}
    forbidden:
      description: Operation is forbidden
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorMessage'}
    serverException:
      description: Unexpected server error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorMessage'}
  schemas:
    EquipmentType:
      type: string
      enum: [STOVE, OVEN, POT, PAN, AIR_FRYER, THERMOMETER, MICROWAVE]
    HeatSource:
      type: string
      enum: [INDUCTION, CERAMIC, ELECTRIC, GAS, OTHER]
    OvenMode:
      type: string
      enum: [CONVENTIONAL, FAN, GRILL]
    ThermometerType:
      type: string
      enum: [INSTANT_READ, PROBE, OTHER]
    KitchenEquipmentInput:
      type: object
      required: [equipmentType, name]
      properties:
        equipmentType: {$ref: '#/components/schemas/EquipmentType'}
        name: {type: string, minLength: 1, maxLength: 255}
        active: {type: boolean, default: true}
        preferred: {type: boolean, default: false}
        heatSource: {$ref: '#/components/schemas/HeatSource'}
        minimumLevel: {type: integer, minimum: 0, nullable: true}
        maximumLevel: {type: integer, minimum: 0, nullable: true}
        heatMappings:
          type: object
          nullable: true
          additionalProperties: {type: string}
        ovenModes:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/OvenMode'}
        minimumTemperatureCelsius: {type: integer, minimum: 1, nullable: true}
        maximumTemperatureCelsius: {type: integer, minimum: 1, nullable: true}
        capacityMl: {type: integer, minimum: 1, nullable: true}
        diameterMm: {type: integer, minimum: 1, nullable: true}
        nonStick: {type: boolean, nullable: true}
        thermometerType: {$ref: '#/components/schemas/ThermometerType'}
        maxPowerWatts: {type: integer, minimum: 1, nullable: true}
    KitchenEquipment:
      allOf:
        - $ref: '#/components/schemas/KitchenEquipmentInput'
        - type: object
          required: [id, active, preferred, createdAt, updatedAt]
          properties:
            id: {type: string, format: uuid, readOnly: true}
            createdAt: {type: string, format: date-time, readOnly: true}
            updatedAt: {type: string, format: date-time, readOnly: true}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 100}
        password: {type: string, minLength: 1}
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 100}
        password: {type: string, minLength: 10}
    CurrentUser:
      type: object
      required: [id, username]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
    RegistrationStatus:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
    CsrfToken:
      type: object
      required: [token]
      properties:
        token: {type: string}
    ProductCategory:
      type: string
      enum: [BAKING, BREAD, DAIRY, EGG, FISH, FROZEN, FRUIT, GRAIN_PASTA, HERB, LEGUME, MEAT, NUT_SEED, OIL_FAT, OTHER, PRESERVED, SAUCE_CONDIMENT, SPICE, STOCK, SWEETENER, VEGETABLE, VINEGAR_ACID, DRY_GOODS]
    Unit:
      type: string
      enum: [GRAM, MILLILITER, PIECE]
    InventoryTrackingMode:
      type: string
      enum: [QUANTITY, PRESENCE]
    CreateProduct:
      type: object
      required: [name, category, defaultUnit]
      properties:
        name: {type: string, minLength: 1, example: Løg}
        category: {$ref: '#/components/schemas/ProductCategory'}
        defaultUnit: {$ref: '#/components/schemas/Unit'}
        inventoryTrackingMode: {$ref: '#/components/schemas/InventoryTrackingMode'}
    Product:
      allOf:
        - $ref: '#/components/schemas/CreateProduct'
        - type: object
          required: [id, inventoryTrackingMode]
          properties:
            id: {type: string, format: uuid}
            sourceTemplateId: {type: string, format: uuid, nullable: true, readOnly: true}
    ProductTemplate:
      type: object
      required: [id, name, category, defaultUnit, defaultTrackingMode, aliases, common]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        category: {$ref: '#/components/schemas/ProductCategory'}
        defaultUnit: {$ref: '#/components/schemas/Unit'}
        defaultTrackingMode: {$ref: '#/components/schemas/InventoryTrackingMode'}
        aliases: {type: array, items: {type: string}}
        common: {type: boolean}
    AddInventoryItem:
      type: object
      required: [productId]
      properties:
        productId: {type: string, format: uuid}
        quantity: {type: number, minimum: 0, exclusiveMinimum: true, multipleOf: 0.5, nullable: true, example: 500}
    AddInventoryQuantity:
      type: object
      properties:
        quantity: {type: number, minimum: 0, exclusiveMinimum: true, multipleOf: 0.5, nullable: true, example: 10}
    UpdateInventoryItem:
      type: object
      required: [quantity]
      properties:
        quantity: {type: number, minimum: 0, multipleOf: 0.5, example: 800}
    InventoryItem:
      type: object
      required: [id, product, unit, available, plannedUsageCount, reservations]
      properties:
        id: {type: string, format: uuid}
        product: {$ref: '#/components/schemas/Product'}
        quantity: {type: number, minimum: 0, multipleOf: 0.5, nullable: true}
        physicalQuantity: {type: number, minimum: 0, nullable: true, readOnly: true}
        reservedQuantity: {type: number, minimum: 0, nullable: true, readOnly: true}
        availableQuantity: {type: number, minimum: 0, nullable: true, readOnly: true}
        plannedShortfall: {type: number, minimum: 0, nullable: true, readOnly: true}
        plannedUsageCount: {type: integer, minimum: 0, readOnly: true}
        reservations: {type: array, readOnly: true, items: {$ref: '#/components/schemas/InventoryReservationDetail'}}
        unit: {$ref: '#/components/schemas/Unit'}
        available: {type: boolean}
    InventoryReservationDetail:
      type: object
      required: [mealPlanId, mealPlanName, plannedRecipeId, recipeId, recipeName, portions, unit]
      properties:
        mealPlanId: {type: string, format: uuid}
        mealPlanName: {type: string}
        plannedRecipeId: {type: string, format: uuid}
        recipeId: {type: string, format: uuid}
        recipeName: {type: string}
        portions: {type: integer, minimum: 1}
        reservedQuantity: {type: number, minimum: 0, nullable: true}
        unit: {$ref: '#/components/schemas/Unit'}
    AddShoppingListItem:
      type: object
      required: [productId]
      properties:
        productId: {type: string, format: uuid}
        quantity: {type: number, minimum: 0, exclusiveMinimum: true, multipleOf: 0.5, nullable: true, example: 500}
    ShoppingListQuantity:
      type: object
      properties:
        quantity: {type: number, minimum: 0, exclusiveMinimum: true, multipleOf: 0.5, nullable: true, example: 10}
    ShoppingListItem:
      type: object
      required: [id, product, unit, purchased]
      properties:
        id: {type: string, format: uuid}
        product: {$ref: '#/components/schemas/Product'}
        quantity: {type: number, minimum: 0, exclusiveMinimum: true, multipleOf: 0.5, nullable: true}
        unit: {$ref: '#/components/schemas/Unit'}
        purchased: {type: boolean}
        purchasedAt: {type: string, format: date-time, nullable: true}
    RecipeUnit:
      type: string
      enum: [GRAM, MILLILITER, PIECE, TEASPOON, TABLESPOON, DECILITER]
    RecipeIngredientInput:
      type: object
      required: [productTemplateId, quantity, unit, sortOrder]
      properties:
        productTemplateId: {type: string, format: uuid}
        quantity: {type: number, exclusiveMinimum: 0}
        unit: {$ref: '#/components/schemas/RecipeUnit'}
        preparation: {type: string, nullable: true}
        sortOrder: {type: integer, minimum: 1}
    RecipeStepInput:
      type: object
      required: [instruction, sortOrder]
      properties:
        instruction: {type: string, minLength: 1}
        sortOrder: {type: integer, minimum: 1}
    RecipeInput:
      type: object
      required: [name, ingredients, steps]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string, nullable: true}
        ingredients: {type: array, items: {$ref: '#/components/schemas/RecipeIngredientInput'}}
        steps: {type: array, items: {$ref: '#/components/schemas/RecipeStepInput'}}
    RecipeIngredient:
      type: object
      required: [id, productTemplateId, productTemplate, quantity, unit, sortOrder]
      properties:
        id: {type: string, format: uuid}
        productTemplateId: {type: string, format: uuid}
        productTemplate: {$ref: '#/components/schemas/ProductTemplate'}
        quantity: {type: number, exclusiveMinimum: 0}
        unit: {$ref: '#/components/schemas/RecipeUnit'}
        preparation: {type: string, nullable: true}
        sortOrder: {type: integer, minimum: 1}
    RecipeStep:
      type: object
      required: [id, instruction, sortOrder]
      properties:
        id: {type: string, format: uuid}
        instruction: {type: string, minLength: 1}
        sortOrder: {type: integer, minimum: 1}
    Recipe:
      type: object
      required: [id, name, ingredients, steps, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string, nullable: true}
        ingredients: {type: array, items: {$ref: '#/components/schemas/RecipeIngredient'} }
        steps: {type: array, items: {$ref: '#/components/schemas/RecipeStep'} }
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        sourceTemplateId: {type: string, format: uuid, nullable: true, readOnly: true}
    RecipeTemplateIngredient:
      type: object
      required: [id, productTemplate, quantity, unit, sortOrder]
      properties:
        id: {type: string, format: uuid}
        productTemplate: {$ref: '#/components/schemas/ProductTemplate'}
        quantity: {type: number, exclusiveMinimum: 0}
        unit: {$ref: '#/components/schemas/RecipeUnit'}
        preparation: {type: string, nullable: true}
        sortOrder: {type: integer, minimum: 1}
    RecipeTemplateStep:
      type: object
      required: [id, instruction, sortOrder]
      properties:
        id: {type: string, format: uuid}
        instruction: {type: string}
        sortOrder: {type: integer, minimum: 1}
    RecipeTemplateSummary:
      type: object
      required: [id, name, active, added]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string, nullable: true}
        active: {type: boolean}
        added: {type: boolean}
        userRecipeId: {type: string, format: uuid, nullable: true}
    RecipeTemplate:
      allOf:
        - $ref: '#/components/schemas/RecipeTemplateSummary'
        - type: object
          required: [createdAt, updatedAt, ingredients, steps]
          properties:
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
            ingredients: {type: array, items: {$ref: '#/components/schemas/RecipeTemplateIngredient'}}
            steps: {type: array, items: {$ref: '#/components/schemas/RecipeTemplateStep'}}
    RecipeSelection:
      type: object
      required: [recipeId, portions]
      properties:
        recipeId: {type: string, format: uuid}
        portions: {type: number, exclusiveMinimum: 0}
    RecipeSelections:
      type: object
      required: [recipes]
      properties:
        recipes: {type: array, minItems: 1, items: {$ref: '#/components/schemas/RecipeSelection'}}
    RecipeRequirement:
      type: object
      required: [productTemplate, trackingMode, unit, satisfied]
      properties:
        productTemplate: {$ref: '#/components/schemas/ProductTemplate'}
        productId: {type: string, format: uuid, nullable: true}
        trackingMode: {$ref: '#/components/schemas/InventoryTrackingMode'}
        requiredQuantity: {type: number, nullable: true}
        unit: {$ref: '#/components/schemas/Unit'}
        physicalQuantity: {type: number, nullable: true}
        reservedQuantity: {type: number, nullable: true}
        availableQuantity: {type: number, nullable: true}
        plannedShortfall: {type: number, nullable: true}
        missingQuantity: {type: number, nullable: true}
        plannedUsageCount: {type: integer, minimum: 0}
        reservations: {type: array, items: {$ref: '#/components/schemas/InventoryReservationDetail'}}
        satisfied: {type: boolean}
        warning: {type: string, nullable: true}
    RecipeRequirementCalculation:
      type: object
      required: [requirements]
      properties:
        requirements: {type: array, items: {$ref: '#/components/schemas/RecipeRequirement'}}
    CookRecipeRequest:
      type: object
      required: [portions]
      properties:
        portions: {type: number, exclusiveMinimum: 0}
    CookRecipeResult:
      type: object
      required: [recipe, portions, cookedAt, deductions, warnings]
      properties:
        recipe: {$ref: '#/components/schemas/Recipe'}
        portions: {type: number}
        cookedAt: {type: string, format: date-time}
        deductions: {type: array, items: {$ref: '#/components/schemas/RecipeRequirement'}}
        warnings: {type: array, items: {type: string}}
    PlannedRecipeStatus:
      type: string
      enum: [PLANNED, COOKED, SKIPPED]
    CreateMealPlan:
      type: object
      required: [name, recipes]
      properties:
        name: {type: string, minLength: 1}
        recipes: {type: array, minItems: 1, items: {$ref: '#/components/schemas/RecipeSelection'}}
    UpdateMealPlan:
      type: object
      required: [name]
      properties: {name: {type: string, minLength: 1}}
    CreatePlannedRecipe:
      type: object
      required: [recipeId, portions]
      properties:
        recipeId: {type: string, format: uuid}
        portions: {type: integer, minimum: 1}
    UpdatePlannedRecipe:
      type: object
      required: [portions]
      properties:
        portions: {type: integer, minimum: 1}
        sortOrder: {type: integer, minimum: 1, nullable: true}
    PlannedRecipe:
      type: object
      required: [id, recipeName, portions, sortOrder, status]
      properties:
        id: {type: string, format: uuid}
        recipe:
          allOf: [{$ref: '#/components/schemas/Recipe'}]
          nullable: true
        recipeName: {type: string}
        portions: {type: integer}
        sortOrder: {type: integer}
        status: {$ref: '#/components/schemas/PlannedRecipeStatus'}
    MealPlan:
      type: object
      required: [id, name, createdAt, updatedAt, recipes, completed]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        recipes: {type: array, items: {$ref: '#/components/schemas/PlannedRecipe'}}
        completed: {type: boolean}
    ErrorMessage:
      type: object
      required: [message, errors, timestamp, correlationId]
      properties:
        message: {type: string}
        errors:
          type: array
          items: {type: string}
        timestamp: {type: string, format: date-time}
        correlationId: {type: string, format: uuid}
