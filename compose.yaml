services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-madkursus}
      POSTGRES_USER: ${POSTGRES_USER:-madkursus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-madkursus}
    ports:
      - "${POSTGRES_BIND_ADDRESS:?Set POSTGRES_BIND_ADDRESS to the server Tailscale IP}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  madkursus:
    build:
      context: .
      dockerfile: Dockerfile
    image: madkursus:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/madkursus_prod}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
